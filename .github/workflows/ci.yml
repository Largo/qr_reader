name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}${{ matrix.yjit && ' (YJIT)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        yjit: [false]
        include:
          - ruby: "4.0"
            yjit: true
    env:
      RUBY_YJIT_ENABLE: ${{ matrix.yjit && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Cache ZXing test corpus
        uses: actions/cache@v4
        with:
          path: test/corpus/zxing
          key: zxing-corpus-v1
      - name: Fetch ZXing test corpus
        run: bundle exec rake corpus:fetch
      - name: Run tests
        run: bundle exec rake test
      - name: Corpus accuracy
        if: matrix.yjit
        run: bundle exec ruby bench/corpus.rb --rotations 0
