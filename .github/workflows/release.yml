# Publishes the gem to RubyGems.org with trusted publishing (OIDC, no API key)
# when a version tag is pushed:
#
#   git tag v0.0.1 && git push origin v0.0.1   (the tag must equal QrReader::VERSION)
#
# Releases both gems, qr_reader and qr_reader-native, at the same version.
# RubyGems.org must know this workflow as a trusted publisher for each of them:
# owner "largo", repository "qr_reader", workflow "release.yml", environment
# "release" (see README, "Releasing").
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token exchanged for a short-lived RubyGems API key
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Check that the tag matches QrReader::VERSION
        run: |
          version=$(ruby -Ilib -e 'require "qr_reader/version"; print QrReader::VERSION')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Run tests
        run: bundle exec rake test
      - name: Build and test with the native kernels
        run: MAKE_JOBS=4 bundle exec rake native:compile native:test
      - name: Build both gems
        run: |
          bundle exec rake build native:gem
          ls -l pkg
      # Exchanges the workflow's OIDC token for a short-lived RubyGems API key.
      - uses: rubygems/configure-rubygems-credentials@v2
      - name: Push both gems
        run: |
          gem push "pkg/qr_reader-${GITHUB_REF_NAME#v}.gem"
          gem push "pkg/qr_reader-native-${GITHUB_REF_NAME#v}.gem"
